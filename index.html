<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tryout TKA Matematika Lanjut 2026</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#18202f;--mu:#5b6578;--bd:#d9dfeb;--pr:#2457c5;--prt:#fff;--ok:#16794a;--okb:#e1f5ea;--no:#b3261e;--nob:#fdeceb;--rg:#b26a00;--rgb:#fff1d6;--sel:#e6eefc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1420;--card:#171e2e;--tx:#e8ecf5;--mu:#9aa5bd;--bd:#2c3650;--pr:#6c97f2;--prt:#0b1020;--ok:#59d193;--okb:#12301f;--no:#ff8c84;--nob:#3a1816;--rg:#f5b84a;--rgb:#3a2c0c;--sel:#1e2b4a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1420;--card:#171e2e;--tx:#e8ecf5;--mu:#9aa5bd;--bd:#2c3650;--pr:#6c97f2;--prt:#0b1020;--ok:#59d193;--okb:#12301f;--no:#ff8c84;--nob:#3a1816;--rg:#f5b84a;--rgb:#3a2c0c;--sel:#1e2b4a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.15rem;margin:.2em 0}
.mu{color:var(--mu);font-size:.9rem}
input{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 15px}
button.p{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:600}
button:disabled{opacity:.45;cursor:default}
button.rg{border-color:var(--rg);color:var(--rg)}button.rg.on{background:var(--rgb)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tag{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:99px;background:var(--sel);color:var(--pr);margin-right:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.grid button{padding:7px 0;font-size:.9rem}
.grid .a{background:var(--sel);border-color:var(--pr)}.grid .r{background:var(--rgb);border-color:var(--rg);color:var(--rg)}.grid .c{outline:3px solid var(--pr);outline-offset:1px;font-weight:700}
.q img{max-width:100%;height:auto;display:block;margin:10px 0;border-radius:6px;background:#fff}
.clip{overflow:hidden;line-height:0}.clip img{clip-path:inset(0 0 11% 0);margin-bottom:-11%!important}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:7px 0;padding:10px 12px}
.opt .l{flex:0 0 28px;height:28px;border-radius:50%;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.opt.s{background:var(--sel);border-color:var(--pr)}.opt.s .l{background:var(--pr);color:var(--prt)}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}
.bsrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}.bsrow b{min-width:110px}
.bsrow button.s{background:var(--pr);color:var(--prt)}.bsrow button.ok{background:var(--okb);border-color:var(--ok)}.bsrow button.no{background:var(--nob);border-color:var(--no)}
.tmr{font-variant-numeric:tabular-nums;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--sel);color:var(--pr);margin-left:8px}.tmr.w{background:var(--nob);color:var(--no)}
.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px}
.big{font-size:3rem;font-weight:800;line-height:1.1}
.pill{display:inline-block;padding:4px 14px;border-radius:99px;font-weight:700}
.Istimewa{background:#ffe9a8;color:#6b4a00}.Baik{background:var(--okb);color:var(--ok)}.Memadai{background:var(--sel);color:var(--pr)}.Kurang{background:var(--nob);color:var(--no)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}.stats div{border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}.stats b{display:block;font-size:1.3rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left}
.sol{background:var(--sel);border-left:4px solid var(--pr);padding:10px 14px;border-radius:8px;margin-top:12px}.sol ol{margin:6px 0;padding-left:20px}
.key{background:var(--okb);color:var(--ok);padding:6px 12px;border-radius:8px;display:inline-block;font-weight:700;margin-top:10px}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{max-width:420px;margin:0}
mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
mjx-container[display="true"]{margin:.6em 0!important}
</style>

const LV=[1,2,1,2,1,2,1,1,2,3,2,3,2,1,1,3,2,2,2,1,3,2,3,3,3];

// ===== IRT-START =====
// Model 3PL (skala D=1,7). Parameter awal ditetapkan dari level kognitif (belum hasil kalibrasi empiris).
const BASE={1:-0.8,2:0.1,3:0.9};
const item=(i)=>({a:0.9+0.15*LV[i],b:BASE[LV[i]]+(((i*7)%5)-2)*0.15,c:Q[i].t==='pg'?0.2:Q[i].t==='mx'?0.05:0.1});
const P3=(th,p)=>p.c+(1-p.c)/(1+Math.exp(-1.7*p.a*(th-p.b)));
function irt(rs){ // rs: skor butir 0..1 ; EAP, prior N(0,1.5^2)
 let num=0,den=0,pv=0;const prm=rs.map((_,i)=>item(i));
 for(let th=-4;th<=4.0001;th+=0.05){let ll=-0.5*(th/1.5)**2;
  rs.forEach((r,i)=>{const p=Math.min(Math.max(P3(th,prm[i]),1e-6),1-1e-6);ll+=r*Math.log(p)+(1-r)*Math.log(1-p)});
  const w=Math.exp(ll);num+=w*th;den+=w}
 const theta=num/den;
 let skor=500+135*theta;skor=Math.min(800,Math.max(200,skor));
 return {theta,skor:Math.round(skor*100)/100};
}
function predikat(skor){const pct=(skor-200)/6;

function grade(i,a){const q=Q[i];
 if(a===undefined||a===null)return 0;
 if(q.t==='pg')return a===q.k?1:0;
 if(q.t==='mx'){const S=a||[];if(!S.length)return 0;const ok=S.filter(x=>q.k.includes(x)).length,bad=S.length-ok;return Math.max(0,(ok-bad)/q.k.length)}
 if(q.t==='bs'){let c=0;q.k.forEach((v,j)=>{if(a[j]===v)c++});return c/q.k.length}}
function answered(i){const a=S.ans[i];const q=Q[i];if(a==null)return false;if(q.t==='mx')return a.length>0;if(q.t==='bs')return a.some(v=>v===true||v===false);return true}

 h+=(q.q?`<div>${q.q}</div>`:'')+imgHTML(q);
 if(q.t==='pg'){h+=L5.map((L,j)=>{let c='opt';if(rev){if(L===q.k)c+=' ok';else if(a===L)c+=' no'}else if(a===L)c+=' s';

   return `<button class="${c}" ${rev?'disabled':`onclick="tog('${L}')"`}><span class="l">${L}</span><span>${q.o[j]}</span></button>`}).join('')}
 if(q.t==='bs'){h+=`<div class="mu">Tentukan Benar atau Salah untuk setiap pernyataan pada tabel di atas.</div>`+q.k.map((kv,j)=>{const v=a?a[j]:null;

 <div class="card"><div class="mu" style="margin-bottom:8px">Navigasi soal (biru = terjawab, kuning = ragu-ragu)</div>${gridHTML(false)}<div style="margin-top:12px;text-align:right"><button class="p" onclick="ask()">Selesai & Kirim</button></div></div>`;
 if(S.confirm){const nr=S.rag.filter(Boolean).length;h+=`<div class="modal"><div class="card"><h2>Kirim jawaban?</h2><p>Soal belum dijawab: <b>${25-nA}</b><br>Soal ditandai ragu-ragu: <b>${nr}</b></p><p class="mu">Setelah dikirim, jawaban tidak dapat diubah.</p><div class="nav"><button onclick="cancel()">Kembali</button><button class="p" onclick="submit()">Ya, Kirim</button></div></div></div>`}}
 if(S.step==='result'){const r=S.res;const lv=[1,2,3].map(l=>{const ix=LV.map((v,i)=>v===l?i:-1).filter(i=>i>=0);const s=ix.reduce((t,i)=>t+r.rs[i],0);return `<tr><td>${LVN[l]}</td><td>${ix.length}</td><td>${fmt(s/ix.length*100)}%</td></tr>`}).join('');
 h=`<div class="card" style="text-align:center"><div class="mu">Hasil Tryout · ${S.name} · ${S.kls}</div>${S.auto?'<div class="pill Kurang" style="margin:8px 0;font-size:.85rem">Waktu habis. Jawaban dikirim otomatis.</div>':''}<div class="big">${fmt(r.skor)}</div><div class="mu">Skor terstandar (200,00 – 800,00)</div><p><span class="pill ${r.pred}">${r.pred}</span></p>
 <div class="stats"><div><b>${r.full}</b>Benar penuh</div><div><b>${r.salah}</b>Salah / sebagian</div><div><b>${r.kos}</b>Kosong</div><div><b>${fmt(r.theta)}</b>Kemampuan θ (IRT)</div><div><b>${fmt(r.pct)}</b>Skala 0–100</div></div>
 <div class="nav" style="justify-content:center"><button class="p" onclick="S.step='review';S.cur=0;render()">Cek Pembahasan</button><button onclick="location.reload()">Ulangi Tes</button></div></div>
 <div class="card"><h2>Kategori Skor</h2><table><tr><td><span class="pill Istimewa">Istimewa</span></td><td>skor 725,00 – 800,00</td></tr><tr><td><span class="pill Baik">Baik</span></td><td>di atas 76,67 hingga di bawah 95,00 (skala 0–100)</td></tr><tr><td><span class="pill Memadai">Memadai</span></td><td>di atas 50,00 hingga 76,67 (skala 0–100)</td></tr><tr><td><span class="pill Kurang">Kurang</span></td><td>di bawah 50,00 (skala 0–100)</td></tr></table></div>
 <div class="card"><h2>Capaian per Level Kognitif</h2><table><tr><th>Level</th><th>Jumlah soal</th><th>Capaian</th></tr>${lv}</table></div>
 <div class="card"><h2>Rincian Butir</h2><table><tr><th>No</th><th>Tipe</th><th>Kunci</th><th>Skor butir</th></tr>${Q.map((q,i)=>`<tr><td><a href="#" onclick="S.step='review';S.cur=${i};render();return false">${i+1}</a></td><td>${TN[q.t]}</td><td>${keyText(q)}</td><td>${answered(i)?(S.res.rs[i]===1?'✓ Benar':'✗ '+fmt(S.res.rs[i]*100)+'%'):'— kosong'}</td></tr>`).join('')}</table></div>`}
 if(S.step==='review'){const i=S.cur,q=Q[i],g=S.res.rs[i];
 h=`<div class="top"><button onclick="S.step='result';render()">← Kembali ke Hasil</button><div class="mu">Mode pembahasan</div></div>
 <div class="card q"><h2>Soal ${i+1} dari 25 · ${answered(i)?(g===1?'<span style="color:var(--ok)">Benar</span>':'<span style="color:var(--no)">'+(g>0?'Sebagian benar':'Salah')+'</span>'):'<span class="mu">Tidak dijawab</span>'}</h2>${qBody(i,true)}
 <div class="key">Kunci: ${keyText(q)}</div>
 <div class="sol"><b>Pembahasan</b><ol>${q.s.map(x=>`<li>${x}</li>`).join('')}</ol></div>
 <div class="nav"><button onclick="go(${i-1})" ${i===0?'disabled':''}>← Sebelumnya</button><button class="p" onclick="go(${i+1})" ${i===24?'disabled':''}>Selanjutnya →</button></div></div>
 <div class="card"><div class="mu" style="margin-bottom:8px">Biru = benar penuh, kuning = salah atau sebagian, polos = kosong</div>${gridHTML(true)}</div>`}
 A.innerHTML=h;typeset()}
render();
</script>
</body>
</html>
